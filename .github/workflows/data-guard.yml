name: Data Guard Backup

# 云端守护：即使你的电脑关机，也会按时检查数据并备份
#
# 流量与存储（实测 6 看板 / 82 卡片）：
#   每次探测：约 0.6 KB（HEAD 计数 0 字节 + id/updated_at 指纹 562 字节）
#   发生变更才全量：约 550 KB
#   Actions 免费额度：私有仓库 2000 分钟/月，本任务每次运行不到 10 秒
#
# 每天运行 288 次（每 5 分钟）→ 探测流量约 0.17 MB/天，几乎为零
# 若一天数据变动 50 次 → 全量流量约 27 MB/天

on:
  schedule:
    # GitHub Actions 的 cron 最短间隔是 5 分钟，直接用
    # 注意：实际触发可能有几到十几分钟延迟，这是 GitHub 的限制
    - cron: '*/5 * * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  # 安全：工作流不再向仓库写入任何内容（备份含全部用户口令与 CRM 联系人），
  # 产物通过 artifact 上传，因此只需要只读权限。
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore guard state
        uses: actions/cache@v4
        with:
          path: .guard-state.json
          key: guard-state-${{ github.run_id }}
          restore-keys: |
            guard-state-

      - name: Probe and backup
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # 写到 runner 临时目录，完全不触碰仓库工作树
          BACKUP_DIR: ${{ runner.temp }}/trello-backups
          GUARD_STATE_FILE: .guard-state.json
        run: node scripts/cloud-guard.mjs --mode=backup

      # 原来的 "Commit backup" 步骤（git add -A + git commit + git push）
      # 已移除：它会把包含明文口令的 users.json 等生产数据提交到仓库。
      # 现在改为上传 artifact，随 workflow 运行过期自动清理。
      - name: Upload backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trello-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/trello-backups
          # 与原先「保留 2 天」的策略对齐（artifact 保留期 1~90 天）
          retention-days: 2
          if-no-files-found: ignore

